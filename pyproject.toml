[project]
name = "vanishcam"
version = "0.1.0"
description = "Verdwijn uit je webcambeeld: achtergrond vastleggen, dissolve, output naar virtuele camera."
requires-python = ">=3.11,<3.15"
dependencies = [
    "opencv-python>=4.9",
    "numpy>=1.26",
    "pyvirtualcam>=0.11",
    "mediapipe>=0.10",
    "sounddevice>=0.5",
    "soundfile>=0.12",
]
